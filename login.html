<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chef Cozinha</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/src/regular/style.css">
  <link rel="stylesheet" href="/vendor/phosphor/src/bold/style.css">
  <link rel="stylesheet" href="/vendor/phosphor/src/fill/style.css">
  <style>
    :root {
      --primary: #fc4b15;
      --primary-dark: #e03a0b;
      --surface: #ffffff;
      --bg: #f8f9fa;
      --text: #1e293b;
      --text-muted: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    body {
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: var(--surface);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .login-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--primary), #ffa726);
    }
    .logo-icon {
      width: 72px; height: 72px;
      background: rgba(252, 75, 21, 0.1);
      color: var(--primary);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 24px;
    }
    h1 { color: var(--text); font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    p.subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }
    
    .input-group { text-align: left; margin-bottom: 20px; position: relative; }
    .input-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 20px; }
    .input-group input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.2s ease;
      background: #f8fafc;
    }
    .input-group input:focus {
      border-color: var(--primary);
      background: #fff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(252, 75, 21, 0.1);
    }
    
    .btn-login {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
    }
    .btn-login:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(252, 75, 21, 0.2);
    }
    .btn-login:active { transform: translateY(0); }
    
    .error-msg {
      color: #ef4444;
      font-size: 14px;
      margin-top: 12px;
      display: none;
      font-weight: 500;
    }

    /* ═══ Seletor de Restaurante (dono de rede) — sensação nativa ═══ */
    .rede-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: none; align-items: flex-end; justify-content: center;
      opacity: 0; transition: opacity 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .rede-overlay.aberto { display: flex; }
    .rede-overlay.visivel { opacity: 1; }
    @media (min-width: 640px) {
      .rede-overlay { align-items: center; }
    }
    .rede-sheet {
      width: 100%; max-width: 420px;
      max-height: 82vh; overflow-y: auto;
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      padding: 12px 20px 28px 20px;
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -12px 48px rgba(0,0,0,0.18);
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 640px) {
      .rede-sheet { border-radius: 24px; transform: translateY(24px) scale(0.96); opacity: 0; }
      .rede-overlay.visivel .rede-sheet { transform: translateY(0) scale(1); }
    }
    .rede-overlay.visivel .rede-sheet { transform: translateY(0); }
    .rede-grabber { width: 40px; height: 5px; border-radius: 3px; background: #e2e8f0; margin: 4px auto 14px auto; }
    .rede-card-restaurante {
      display: flex; align-items: center; gap: 14px; width: 100%;
      background: #f8fafc; border: 2px solid transparent; border-radius: 16px;
      padding: 14px; margin-bottom: 10px; cursor: pointer; text-align: left;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rede-card-restaurante:hover { border-color: #fec7ad; background: #fff7f3; }
    .rede-card-restaurante:active { transform: scale(0.97); }
    .rede-avatar {
      width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 19px;
      background: linear-gradient(135deg, var(--primary), #ffa726);
      box-shadow: 0 4px 12px rgba(252, 75, 21, 0.25);
    }
    .rede-badge-atual {
      background: #dcfce7; color: #166534; font-size: 10.5px; font-weight: 800;
      padding: 2px 9px; border-radius: 10px; margin-left: auto; flex-shrink: 0;
    }
  
    /* ═══ MODO HORIZONTAL (LANDSCAPE / TELAS BAIXAS) — LADO A LADO ═══ */
    @media (orientation: landscape) and (max-height: 550px), (max-height: 500px) {
      body {
        padding: 10px;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
      }
      .login-container {
        max-width: 640px !important;
        padding: 18px 24px !important;
        border-radius: 20px !important;
        display: grid !important;
        grid-template-columns: 1fr 1.2fr !important;
        gap: 20px !important;
        align-items: center !important;
        text-align: left !important;
      }
      .login-header-side {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .logo-icon {
        width: 46px !important;
        height: 46px !important;
        border-radius: 12px !important;
        font-size: 22px !important;
        margin: 0 0 10px 0 !important;
      }
      h1 {
        font-size: 20px !important;
        margin-bottom: 4px !important;
      }
      p.subtitle {
        font-size: 12px !important;
        margin-bottom: 14px !important;
      }
      .login-type-toggle {
        margin-bottom: 0 !important;
      }
      .login-form-side {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .input-group {
        margin-bottom: 10px !important;
      }
      .input-group label {
        font-size: 11.5px !important;
        margin-bottom: 4px !important;
      }
      .input-group input {
        padding: 8px 12px 8px 36px !important;
        font-size: 13px !important;
        border-radius: 10px !important;
      }
      .input-wrapper i {
        left: 12px !important;
        font-size: 16px !important;
      }
      .btn-login {
        padding: 10px !important;
        font-size: 14px !important;
        margin-top: 6px !important;
        border-radius: 10px !important;
      }
      .login-footer-link {
        margin-top: 8px !important;
        font-size: 11.5px !important;
      }
    }

  </style>
  <script src="/locales.js"></script>
  <script src="/i18n.js"></script>
<link rel="icon" href="/icons/icon.ico">
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#fc4b15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chef Cozinha">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
  </head>
<body>
  <div class="login-container">
    <div class="login-header-side">
      <div class="logo-icon">
      <i class="ph ph-cooking-pot"></i>
    </div>
    <h1>Bem-vindo de volta!</h1>
    <p class="subtitle">Faça login para acessar o sistema.</p>
    
    <!-- Seletor de Destino do Login -->
      <div class="login-type-toggle" style="display:flex;background:#f1f5f9;padding:4px;border-radius:12px;margin-bottom:14px;">
      <button id="tab-login-sistema" type="button" onclick="setDestinoLogin('sistema')" style="flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;background:var(--primary);color:white;transition:all 0.2s;">
        <i class="ph ph-desktop"></i> Sistema Operacional
      </button>
      <button id="tab-login-dono" type="button" onclick="setDestinoLogin('dono')" style="flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;background:transparent;color:var(--text-muted);transition:all 0.2s;">
        <i class="ph ph-chart-line-up"></i> Painel do Dono
      </button>
    </div>
    
    </div>
    <div class="login-form-side">
      <div class="input-group">
        <label>Usuário (E-mail)</label>
      <div class="input-wrapper">
        <i class="ph ph-user"></i>
        <input type="text" id="username" placeholder="Digite seu e-mail" autocomplete="username">
      </div>
    </div>
    
    <div class="input-group">
      <label>Senha</label>
      <div class="input-wrapper">
        <i class="ph ph-lock-key"></i>
        <input type="password" id="password" placeholder="Sua senha secreta" autocomplete="current-password">
      </div>
    </div>
    
    <button class="btn-login" id="btn-submit">Entrar no Sistema</button>
    <div class="error-msg" id="error-msg">Usuário ou senha inválidos.</div>
    <div class="login-footer-link" style="margin-top: 10px;">
      <a href="/registro.html" style="color: var(--primary); text-decoration: none; font-size: 15px; font-weight: 600; transition: color 0.2s;">
        Novo Restaurante? <span style="text-decoration: underline;">Criar Conta de Teste (SaaS)</span>
      </a>
    </div>
  </div>

  <!-- ═══ Seletor de Restaurante — dono com múltiplos estabelecimentos ═══ -->
  <div class="rede-overlay" id="rede-overlay">
    <div class="rede-sheet" role="dialog" aria-modal="true" aria-label="Escolher restaurante">
      <div class="rede-grabber"></div>
      <h2 style="font-size:20px; font-weight:700; color:var(--text); margin-bottom:4px;">Qual restaurante hoje?</h2>
      <p id="rede-saudacao" style="color:var(--text-muted); font-size:13.5px; margin-bottom:18px;">Você administra mais de um estabelecimento.</p>
      <div id="rede-lista"></div>
      <button onclick="fecharSeletorRede()" style="width:100%; margin-top:6px; padding:12px; background:none; border:none; color:#94a3b8; font-size:13px; font-weight:600; cursor:pointer;">Cancelar</button>
    </div>
  </div>
  <script src="/socket.io.min.js"></script>
  <script src="login.js"></script>

<script src="/fullscreen.js"></script>

</body>
</html>
