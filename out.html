  <title>Login - Chef Cozinha</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --primary: #fc4b15;
      --primary-dark: #e03a0b;
      --surface: #ffffff;
      --bg: #f8f9fa;
      --text: #1e293b;
      --text-muted: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    body {
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: var(--surface);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .login-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--primary), #ffa726);
    }
    .logo-icon {
      width: 72px; height: 72px;
      background: rgba(252, 75, 21, 0.1);
      color: var(--primary);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 24px;
    }
    h1 { color: var(--text); font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    p.subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }
    
    .input-group { text-align: left; margin-bottom: 20px; position: relative; }
    .input-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 20px; }
    .input-group input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.2s ease;
      background: #f8fafc;
    }
    .input-group input:focus {
      border-color: var(--primary);
      background: #fff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(252, 75, 21, 0.1);
    }
    
    .btn-login {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
    }
    .btn-login:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(252, 75, 21, 0.2);
    }
    .btn-login:active { transform: translateY(0); }
    
    .error-msg {
      color: #ef4444;
      font-size: 14px;
      margin-top: 12px;
      display: none;
      font-weight: 500;
    }
  </style>
  <script src="login.js"></script>

<body>
  <div class="login-container">
    <div class="logo-icon">
      <i class="ph ph-cooking-pot"></i>
    </div>
    <h1>Bem-vindo de volta!</h1>
    <p class="subtitle">Faça login para acessar o sistema.</p>
    
    <div class="input-group">
      <label>Usuário</label>
      <div class="input-wrapper">
        <i class="ph ph-user"></i>
        <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username">
      </div>
    </div>
    
    <div class="input-group">
      <label>Senha</label>
      <div class="input-wrapper">
        <i class="ph ph-lock-key"></i>
        <input type="password" id="password" placeholder="Sua senha secreta" autocomplete="current-password">
      </div>
    </div>
    
    <button class="btn-login" id="btn-submit">Entrar no Sistema</button>
    <div class="error-msg" id="error-msg">Usuário ou senha inválidos.</div>
  </div>
