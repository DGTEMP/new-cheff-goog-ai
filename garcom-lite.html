.split-bar {

}
.method-btn {
  -webkit-box-flex: 1; -webkit-flex: 1 1 calc(50% - 6px); -ms-flex: 1 1 calc(50% - 6px); flex: 1 1 calc(50% - 6px);

  background: #2a2d35; border: 1px solid #3a3d45; color: #cbd5e0; cursor: pointer; text-align: center;
}
body.light .method-btn { background: #edf2f7; border-color: #cbd5e0; color: #2d3748; }
.method-btn.active { background: #fc4b15; border-color: #fc4b15; color: #fff; }

.calc-troco {
  background: #111318; border: 1px solid #2a2d35; border-radius: 8px; padding: 10px; margin-top: 8px;

/* ─── BOTTOM NAVIGATION ─── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 50px;
  background: #1a1d24; border-top: 2px solid #2a2d35; z-index: 100;

}

<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-inner">
    <div class="hdr-title" id="hdr-title" style="display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;gap:6px;">
      <img src="/icons/icon-192.png" alt="Logo" style="width:24px;height:24px;border-radius:6px;object-fit:cover;">
      <span>Garçom Lite</span>
    </div>
    <div class="hdr-right">
      <button class="btn-hdr" id="btn-theme" onclick="toggleTema()">🌙</button>
      <button class="btn-hdr" id="btn-refresh" onclick="carregarDados(true)">🔄</button>
      <button class="btn-hdr" id="btn-logout" style="display:none;" onclick="fazerLogout()">Sair</button>
    </div>
  </div>
</div>

<!-- STATUS & OUTBOX BAR -->
<div class="status-bar online" id="status-bar">Conectado (Tempo Real)</div>

<div class="container">

  <!-- VIEW: LOGIN -->
  <div class="view active" id="view-login">
    <div class="login-box">
      <img src="/icons/icon-192.png" alt="Chef Cozinha" style="width:48px;height:48px;border-radius:12px;margin:0 auto 10px auto;display:block;box-shadow:0 4px 12px rgba(252,75,21,0.25);">
      <h2>Acesso Garçom</h2>
      <p style="font-size:12px;color:#94a3b8;margin-bottom:12px;">Conexão Rápida para qualquer dispositivo</p>
      <input type="text" id="login-user" placeholder="Usuário / Garçom" autocomplete="off" onkeydown="if(event.keyCode===13)fazerLogin()">
      <input type="password" id="login-pass" placeholder="Senha" autocomplete="off" onkeydown="if(event.keyCode===13)fazerLogin()">
      <button class="btn-primary" onclick="fazerLogin()">Entrar no Sistema</button>
      <div class="login-msg" id="login-msg"></div>
    </div>
  </div>

  <!-- VIEW: MESAS -->
  <div class="view" id="view-mesas">
    <div style="display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-pack:justify;-webkit-justify-content:space-between;-ms-flex-pack:justify;justify-content:space-between;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;margin-bottom:4px;">

    </div>

  </div>

  <!-- VIEW: MENU / CARDÁPIO -->
  <div class="view" id="view-menu">
    <button class="btn-back" onclick="voltarMesas()">&larr; Voltar para Mesas</button>
    
    <div class="mesa-action-bar">
      <button onclick="abrirComanda()">📋 Comanda</button>
      <button class="act-conta" onclick="abrirConta()">🧾 Ver Conta</button>
      <button class="act-cobranca" onclick="abrirCobranca()">💰 Cobrar</button>
      <button onclick="abrirCarrinho()">🛒 Carrinho (<span id="cart-badge-count">0</span>)</button>
    </div>

    <div class="search-box">
      <input type="text" id="menu-search" placeholder="🔍 Buscar produto (ex: refri, carne, pizza)..." oninput="filtrarCardapio()">
    </div>

    <div class="cats-bar" id="cats-bar"></div>
    <div class="prod-grid" id="prod-grid"></div>
  </div>

  <!-- VIEW: DETALHE DO PRODUTO -->
  <div class="view" id="view-detail">
    <button class="btn-back" onclick="voltarMenu()">&larr; Voltar ao Cardápio</button>
    <div class="bill-box" id="detail-box"></div>
  </div>

  <!-- VIEW: CARRINHO -->
  <div class="view" id="view-cart">
    <button class="btn-back" onclick="voltarMenu()">&larr; Continuar Pedindo</button>
    <h3 style="text-align:center;font-size:16px;color:#fc4b15;margin-bottom:8px;">Carrinho — <span id="cart-mesa-nome"></span></h3>
    <div id="cart-items-list"></div>
    <div id="cart-summary-box" style="margin-top:10px;"></div>
  </div>

  <!-- VIEW: COMANDA DA MESA -->
  <div class="view" id="view-comanda">
    <button class="btn-back" onclick="voltarMenu()">&larr; Voltar</button>
    <h3 style="text-align:center;font-size:16px;color:#fc4b15;margin-bottom:8px;">Comanda — <span id="comanda-mesa-nome"></span></h3>
    <div id="comanda-items-list"></div>
  </div>

  <!-- VIEW: CONTA DO CLIENTE (PREVIEW) -->
  <div class="view" id="view-conta">
    <button class="btn-back" onclick="voltarMenu()">&larr; Voltar</button>
    <div class="bill-box" id="conta-box"></div>
    <button class="btn-primary" onclick="abrirCobranca()" style="background:#16a34a;">Ir para Cobrança da Mesa</button>
  </div>

  <!-- VIEW: COBRANÇA E CHECKOUT -->
  <div class="view" id="view-cobranca">
    <button class="btn-back" onclick="voltarMenu()">&larr; Voltar</button>
    <div class="bill-box" id="cobranca-box"></div>
  </div>

  <!-- VIEW: PEDIDOS / PRONTOS (KDS FEED) -->
  <div class="view" id="view-pedidos">
    <h3 style="font-size:14px;color:#94a3b8;text-transform:uppercase;margin-bottom:8px;">Prontos na Cozinha & Meus Pedidos</h3>
    <div id="pedidos-feed-list"></div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav" id="bottom-nav" style="display:none;">

    <span>Mesas</span>
  </button>
  <button class="nav-item" id="nav-cart" onclick="switchTab('cart')">

  <button class="nav-item" id="nav-pedidos" onclick="switchTab('pedidos')">
    <span style="font-size:16px;">🔔</span>
    <span>Prontos <span class="nav-badge" id="nav-pronto-badge" style="display:none;">0</span></span>
  </button>
  <button class="nav-item" onclick="window.location.href='/fila-lite.html'">
    <span style="font-size:16px;">🍳</span>
    <span>Fila</span>
  </button>
  <button class="nav-item" onclick="window.location.href='/caixa-lite.html'">
    <span style="font-size:16px;">💰</span>
    <span>Caixa</span>
  </button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- COMPATIBILITY SCRIPTS -->

<script src="/socket.io.min.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   GARÇOM LITE — ULTRA-COMPATIBLE RUNTIME ENGINE (ES3/ES5 ZERO-CRASH)
   Runs on everything from legacy 2005 devices to modern smartphones!
   ═══════════════════════════════════════════════════════════════════════ */
(function() {
  // ── POLYFILLS & SAFETY GUARDS ──
  if (!window.JSON) {
    window.JSON = {
      parse: function(s) { return eval('(' + s + ')'); },
      stringify: function(obj) {
        var t = typeof obj;
        if (t !== "object" || obj === null) {
          if (t === "string") return '"' + obj.replace(/"/g, '\\"') + '"';
          return String(obj);
        }
        var isArr = (obj && obj.constructor === Array);
        var json = [];
        for (var n in obj) {
          if (obj.hasOwnProperty(n)) {
            var v = obj[n];
            var vt = typeof v;
            if (vt === "string") v = '"' + v.replace(/"/g, '\\"') + '"';
            else if (vt === "object" && v !== null) v = JSON.stringify(v);
            json.push((isArr ? "" : '"' + n + '":') + String(v));
          }
        }
        return (isArr ? "[" : "{") + String(json) + (isArr ? "]" : "}");
      }
    };
  }

  var StorageUtil = {
    get: function(k) {
      try { return localStorage.getItem(k); } catch(e) { return null; }
    },
    set: function(k, v) {
      try { localStorage.setItem(k, v); } catch(e) {}
    },
    remove: function(k) {
      try { localStorage.removeItem(k); } catch(e) {}
    }
  };

  // ── STATE VARIABLES ──
  var USER = null;
  var MESAS = [];
  var PEDIDOS = [];
  var PRODUTOS = [];
  var CATEGORIAS = [];
  var CAT_ATUAL = '';
  var CART = [];
  var MESA_ATUAL = '';
  var PROD_ATUAL = null;
  var QTY_ATUAL = 1;
  var SEARCH_TERM = '';
  var TAXA_SERVICO = 10;
  var CHAVE_PIX = '';
  var FORMAS_PAGAMENTO = [];
  var METODO_COBRANCA = 'Dinheiro';
  var GORJETA_COBRANCA = 0;
  var DIVISAO_PESSOAS = 1;
  var INCLUIR_TAXA_SERVICO = true;
  var VALOR_PAGO_DINHEIRO = 0;
  var OUTBOX_QUEUE = [];
  var POLL_INTERVAL = 5000;
  var pollTimer = null;
  var socket = null;
  var isSyncingOutbox = false;

  function $(id) { return document.getElementById(id); }

  function safeHtml(str) {
    if (!str && str !== 0) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatMoney(num) {
    var n = parseFloat(num) || 0;
    return 'R$ ' + n.toFixed(2).replace('.', ',');
  }

  // ── THEME HELPER ──
  function getTema() {
    return StorageUtil.get('garcom_lite_theme') || 'dark';
  }
  window.toggleTema = function() {
    var isLight = document.body.className === 'light';
    document.body.className = isLight ? '' : 'light';
    StorageUtil.set('garcom_lite_theme', isLight ? 'dark' : 'light');
    var bt = $('btn-theme');
    if (bt) bt.innerHTML = isLight ? '🌙' : '☀️';
  };
  function aplicarTema() {
    if (getTema() === 'light') {
      document.body.className = 'light';
      var bt = $('btn-theme');
      if (bt) bt.innerHTML = '☀️';
    }
  }

  // ── TOAST NOTIFICATIONS ──
  var toastTimeout = null;
  function showToast(msg) {
    var t = $('toast');
    if (!t) return;
    t.innerHTML = msg;
    t.style.display = 'block';
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function() { t.style.display = 'none'; }, 2800);
    try { if (navigator.vibrate) navigator.vibrate(50); } catch(e) {}
  }

  // ── STATUS BAR UPDATER ──
  function updateStatusBar(mode, text) {
    var bar = $('status-bar');
    if (!bar) return;
    bar.className = 'status-bar ' + mode;
    bar.innerHTML = text;
  }

  // ── HTTP XHR HELPER (ES3/ES5) ──
  function makeXHR(method, url, data, cb) {
    var x = null;
    if (window.XMLHttpRequest) {
      x = new XMLHttpRequest();
    } else if (window.ActiveXObject) {
      try { x = new ActiveXObject("Msxml2.XMLHTTP"); } catch(e) {
        try { x = new ActiveXObject("Microsoft.XMLHTTP"); } catch(e2) {}
      }
    }
    if (!x) {
      cb(new Error('Navegador sem suporte a AJAX'), null);
      return;
    }

    var tenantId = StorageUtil.get('restaurante_id') || '1';
    var sep = url.indexOf('?') === -1 ? '?' : '&';
    url = url + sep + 'restaurante_id=' + encodeURIComponent(tenantId);

    x.open(method, url, true);
    x.setRequestHeader('Content-Type', 'application/json');

    x.onreadystatechange = function() {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try {
          var parsed = JSON.parse(x.responseText);
          cb(null, parsed);
        } catch(e) {
          cb(null, { ok: true, text: x.responseText });
        }
      } else {
        var errObj = null;
        try { errObj = JSON.parse(x.responseText); } catch(e) {}
        var msg = (errObj && errObj.error) ? errObj.error : ('HTTP ' + x.status);
        cb(new Error(msg), errObj);
      }
    };

    x.onerror = function() {
      cb(new Error('Erro de conexão com o servidor'), null);
    };

    if (data) {
      if (typeof data === 'object' && !data.restaurante_id) {
        data.restaurante_id = tenantId;
      }
      x.send(JSON.stringify(data));
    } else {
      x.send(null);
    }
  }

  // ── OUTBOX & OFFLINE QUEUE ──
  function carregarOutbox() {
    try {
      var s = StorageUtil.get('garcom_lite_outbox');
      if (s) OUTBOX_QUEUE = JSON.parse(s) || [];
    } catch(e) { OUTBOX_QUEUE = []; }
    verificarOutbox();
  }

  function salvarOutbox() {
    try { StorageUtil.set('garcom_lite_outbox', JSON.stringify(OUTBOX_QUEUE)); } catch(e) {}
    verificarOutbox();
  }

  function verificarOutbox() {
    if (OUTBOX_QUEUE.length > 0) {
      updateStatusBar('outbox', '📤 ' + OUTBOX_QUEUE.length + ' pedido(s) na fila (sincronizando...)');
      processarOutbox();
    }
  }

  function processarOutbox() {
    if (isSyncingOutbox || !OUTBOX_QUEUE.length) return;
    isSyncingOutbox = true;
    var task = OUTBOX_QUEUE[0];

    makeXHR(task.method, task.url, task.data, function(err, res) {
      isSyncingOutbox = false;
      if (!err && res && (res.success || res.ok)) {
        OUTBOX_QUEUE.shift();
        salvarOutbox();
        showToast('✅ Item sincronizado com sucesso!');
        carregarDados();
        if (OUTBOX_QUEUE.length > 0) {
          setTimeout(processarOutbox, 500);
        } else {
          updateStatusBar('online', 'Conectado (Tempo Real)');
        }
      } else {
        // Retry later
        updateStatusBar('offline', '⚠️ Sem sinal. ' + OUTBOX_QUEUE.length + ' na fila. Tentando reconectar...');
      }
    });
  }

  // ── SOCKET.IO HYBRID REALTIME ENGINE ──
  function setupSocket() {
    try {
      if (typeof io === 'function') {
        var tid = StorageUtil.get('restaurante_id') || '1';
        socket = io({ query: { restaurante_id: tid }, timeout: 6000, reconnectionAttempts: 5 });
        
        socket.on('connect', function() {
          updateStatusBar('online', '🟢 Conectado em Tempo Real');
          processarOutbox();
        });

        socket.on('disconnect', function() {
          updateStatusBar('offline', '🟡 Modo Polling Ativado');
        });

        socket.on('novo_pedido_sync', function() { carregarDados(); });
        socket.on('pedido_atualizado', function() { carregarDados(); });
        socket.on('mesas_atualizadas', function() { carregarDados(); });
        socket.on('mesa_finalizada', function() { carregarDados(); });
        socket.on('atualizacao_caixa', function() { carregarDados(); });
      }
    } catch(e) {
      socket = null;
    }
  }

  // ── CARREGAMENTO DE DADOS ──
  function carregarConfig() {
    makeXHR('GET', '/api/retro/config', null, function(err, data) {
      if (!err && data) {
        if (data.taxa_servico !== undefined) TAXA_SERVICO = Number(data.taxa_servico) || 10;
        if (data.chave_pix) CHAVE_PIX = data.chave_pix;
        if (data.formas_pagamento && data.formas_pagamento.length) FORMAS_PAGAMENTO = data.formas_pagamento;
      }
    });
  }

  window.carregarDados = function(manual) {
    if (manual) showToast('Atualizando...');
    makeXHR('GET', '/api/retro/cardapio', null, function(err, data) {
      if (!err && data && data.produtos) {
        PRODUTOS = [];
        var catsMap = {};
        for (var i = 0; i < data.produtos.length; i++) {
          var p = data.produtos[i];
          if ((p.status || '').toLowerCase() === 'inativo') continue;
          PRODUTOS.push({
            id: p.id,
            categoria: p.categoria || 'Geral',
            nome: p.nome,
            preco: Number(p.preco) || 0,
            emoji: p.emoji || '🍽️',
            setor: p.setor || '',
            status_inicial: p.status_inicial || 'Em preparo'
          });
          catsMap[p.categoria || 'Geral'] = true;
        }
        CATEGORIAS = [];
        for (var c in catsMap) {
          if (catsMap.hasOwnProperty(c)) CATEGORIAS.push(c);
        }
        CATEGORIAS.sort();
        if (CATEGORIAS.length && !CAT_ATUAL) CAT_ATUAL = CATEGORIAS[0];
      }
    });

    makeXHR('GET', '/api/retro/mesas', null, function(err, data) {
      if (!err && data) {
        MESAS = data.mesas || [];
        PEDIDOS = data.pedidos || [];
        renderMesas();
        atualizarBadges();

        var pv = $('view-pedidos');
        if (pv && pv.className.indexOf('active') !== -1) renderPedidos();
        var cv = $('view-comanda');
        if (cv && cv.className.indexOf('active') !== -1) renderComanda();
        var ctv = $('view-conta');
        if (ctv && ctv.className.indexOf('active') !== -1) renderConta();
        var cbv = $('view-cobranca');
        if (cbv && cbv.className.indexOf('active') !== -1) renderCobranca();
      }
    });
  };

  // ── AUTHENTICATION ──
  window.fazerLogin = function() {
    var uEl = $('login-user');
    var pEl = $('login-pass');
    var msgEl = $('login-msg');
    if (!uEl || !pEl) return;
    var u = (uEl.value || '').replace(/^\s+|\s+$/g, '');
    var p = (pEl.value || '').replace(/^\s+|\s+$/g, '');
    if (!u || !p) {
      if (msgEl) { msgEl.innerHTML = 'Informe o usuário e a senha.'; msgEl.style.display = 'block'; }
      return;
    }
    if (msgEl) msgEl.style.display = 'none';
    showToast('Conectando...');

    makeXHR('POST', '/api/retro/login', { usuario: u, senha: p }, function(err, res) {
      if (err || !res || !res.ok) {
        var msg = (res && res.error) ? res.error : (err ? err.message : 'Falha na autenticação');
        if (msgEl) { msgEl.innerHTML = msg; msgEl.style.display = 'block'; }
        return;
      }
      USER = res.funcionario || { nome: u, cargo: 'Garçom' };
      StorageUtil.set('garcom_lite_auth', JSON.stringify({ usuario: u, senha: p }));
      showToast('Bem-vindo, ' + USER.nome + '!');
      
      $('view-login').className = 'view';
      $('view-mesas').className = 'view active';
      $('hdr-title').innerHTML = 'Mesas';
      $('btn-logout').style.display = '';
      $('bottom-nav').style.display = '';

      iniciarAplicacao();
    });
  };

  function tryAutoLogin() {
    try {
      var saved = StorageUtil.get('garcom_lite_auth');
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && parsed.usuario && parsed.senha) {
          $('login-user').value = parsed.usuario;
          $('login-pass').value = parsed.senha;
          window.fazerLogin();
        }
      }
    } catch(e) {}
  }

  window.fazerLogout = function() {
    USER = null;
    CART = [];
    MESA_ATUAL = '';
    StorageUtil.remove('garcom_lite_auth');
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].className = 'view';
    $('view-login').className = 'view active';
    $('hdr-title').innerHTML = 'Garçom Lite';
    $('btn-logout').style.display = 'none';
    $('bottom-nav').style.display = 'none';
  };

  function iniciarAplicacao() {
    carregarConfig();
    carregarDados();
    carregarOutbox();
    setupSocket();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function() { carregarDados(false); }, POLL_INTERVAL);
  }

  // ── MESAS VIEW ──
  function renderMesas() {
    var g = $('mesas-grid');
    if (!g) return;
    var countOcupadas = 0;

    var h = '';
    for (var i = 0; i < MESAS.length; i++) {
      var m = MESAS[i];
      var st = (m.status || 'Disponível').toLowerCase();
      var badgeClass = 'm-badge-livre';
      var badgeLabel = 'Livre';
      if (st.indexOf('ocup') !== -1) {
        badgeClass = 'm-badge-ocupada';
        badgeLabel = 'Ocupada';
        countOcupadas++;
      } else if (st.indexOf('fech') !== -1) {
        badgeClass = 'm-badge-fechando';
        badgeLabel = 'Fechando';
        countOcupadas++;
      }

      var itensMesa = [];
      var totalMesa = 0;
      var prontosCount = 0;

      for (var j = 0; j < PEDIDOS.length; j++) {
        var pj = PEDIDOS[j];
        if (pj.localName === m.nome || pj.mesa_comanda === m.nome || pj.mesa_grupo === m.nome) {
          itensMesa.push(pj);
          totalMesa += Number(pj.total) || 0;
          if (pj.status === 'Pronto') prontosCount++;
        }
      }

      var nomeEsc = safeHtml(m.nome);
      h += '<div class="mesa-card" onclick="abrirMesa(\'' + m.nome.replace(/'/g, "\\'") + '\')">';
      h += '<div class="m-nome">' + nomeEsc + '</div>';
      h += '<div><span class="m-badge ' + badgeClass + '">' + badgeLabel + '</span></div>';
      
      if (itensMesa.length > 0) {
        h += '<div class="m-total">' + formatMoney(totalMesa) + '</div>';
        h += '<div class="m-info">' + itensMesa.length + ' item(ns)' + (prontosCount > 0 ? ' • <span style="color:#22c55e;font-weight:700;">' + prontosCount + ' pronto!</span>' : '') + '</div>';
      } else {
        h += '<div class="m-info">Nenhum consumo</div>';
      }
      h += '</div>';
    }

    if (!MESAS.length) {
      h = '<div style="text-align:center;padding:24px;color:#94a3b8;width:100%;">Nenhuma mesa cadastrada no sistema.</div>';
    }

    g.innerHTML = h;
    var resEl = $('mesas-resumo');
    if (resEl) resEl.innerHTML = countOcupadas + ' ocupada(s) de ' + MESAS.length;
  }

  window.abrirMesa = function(nome) {
    MESA_ATUAL = nome;
    $('hdr-title').innerHTML = nome;
    $('cart-mesa-nome').innerHTML = nome;
    $('comanda-mesa-nome').innerHTML = nome;

    $('view-mesas').className = 'view';
    renderMenu();
    $('view-menu').className = 'view active';
  };

  window.voltarMesas = function() {
    MESA_ATUAL = '';
    SEARCH_TERM = '';
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].className = 'view';
    $('view-mesas').className = 'view active';
    $('hdr-title').innerHTML = 'Mesas';
    switchTabButtons('mesas');
    renderMesas();
  };

  // ── MENU & PRODUCT LIST ──
  function renderMenu() {
    var chips = $('cats-bar');
    if (chips) {
      var ch = '';
      for (var i = 0; i < CATEGORIAS.length; i++) {
        var c = CATEGORIAS[i];
        var act = (c === CAT_ATUAL) ? ' active' : '';
        ch += '<span class="cat-chip' + act + '" onclick="selecionarCat(\'' + c.replace(/'/g, "\\'") + '\')">' + safeHtml(c) + '</span>';
      }
      chips.innerHTML = ch;
    }

    var grid = $('prod-grid');
    if (!grid) return;

    var termo = (SEARCH_TERM || '').replace(/^\s+|\s+$/g, '');
    var displayProds = [];

    if (termo && window.FuzzySearch) {
      displayProds = window.FuzzySearch.filter(PRODUTOS, termo, function(p) { return [p.nome, p.categoria || '']; });
    } else {
      for (var j = 0; j < PRODUTOS.length; j++) {
        if (!CAT_ATUAL || PRODUTOS[j].categoria === CAT_ATUAL) {
          displayProds.push(PRODUTOS[j]);
        }
      }
    }

    var ph = '';
    for (var k = 0; k < displayProds.length; k++) {
      var prod = displayProds[k];
      ph += '<div class="prod-card" onclick="abrirProduto(' + prod.id + ')">';
      ph += '<div class="prod-emoji">' + (prod.emoji || '🍽️') + '</div>';
      ph += '<div class="prod-info">';
      ph += '<div class="prod-nome">' + safeHtml(prod.nome) + '</div>';
      ph += '<div class="prod-preco">' + formatMoney(prod.preco) + '</div>';
      if (prod.setor) ph += '<div style="font-size:10px;color:#94a3b8;">' + safeHtml(prod.setor) + '</div>';
      ph += '</div>';
      ph += '</div>';
    }

    if (!displayProds.length) {
      ph = '<div style="text-align:center;padding:20px;color:#94a3b8;width:100%;">Nenhum produto encontrado.</div>';
    }
    grid.innerHTML = ph;
    atualizarCartBadge();
  }

  window.selecionarCat = function(c) {
    CAT_ATUAL = c;
    SEARCH_TERM = '';
    var input = $('menu-search');
    if (input) input.value = '';
    renderMenu();
  };

  window.filtrarCardapio = function() {
    var input = $('menu-search');
    SEARCH_TERM = input ? input.value : '';
    renderMenu();
  };

  // ── PRODUCT DETAIL & ADD TO CART ──
  window.abrirProduto = function(id) {
    PROD_ATUAL = null;
    QTY_ATUAL = 1;
    for (var i = 0; i < PRODUTOS.length; i++) {
      if (PRODUTOS[i].id === id) { PROD_ATUAL = PRODUTOS[i]; break; }
    }
    if (!PROD_ATUAL) return;

    var v = $('view-detail');
    var b = $('detail-box');
    if (!b) return;

    var dh = '<div style="text-align:center;">';
    dh += '<div style="font-size:44px;">' + (PROD_ATUAL.emoji || '🍽️') + '</div>';
    dh += '<div style="font-size:18px;font-weight:700;margin-top:6px;">' + safeHtml(PROD_ATUAL.nome) + '</div>';
    dh += '<div style="font-size:16px;font-weight:700;color:#fc4b15;margin-top:4px;">' + formatMoney(PROD_ATUAL.preco) + '</div>';
    dh += '</div>';

    dh += '<div class="qty-stepper">';
    dh += '<button onclick="ajustarQty(-1)">-</button>';
    dh += '<span class="qty-val" id="detail-qty-val">1</span>';
    dh += '<button onclick="ajustarQty(1)">+</button>';
    dh += '</div>';

    dh += '<div style="margin-top:10px;">';
    dh += '<label style="font-size:12px;font-weight:700;color:#94a3b8;display:block;margin-bottom:4px;">Observações (ex: sem gelo, bem passado):</label>';
    dh += '<input type="text" id="detail-obs" placeholder="Ex: sem cebola, ponto da carne..." style="width:100%;padding:10px;border-radius:6px;border:1px solid #3a3d45;background:#111318;color:#fff;">';
    dh += '</div>';

    dh += '<button class="btn-primary" id="btn-add-cart" onclick="confirmarAddCarrinho()">Adicionar ao Carrinho — ' + formatMoney(PROD_ATUAL.preco) + '</button>';

    b.innerHTML = dh;

    $('view-menu').className = 'view';
    v.className = 'view active';
  };

  window.ajustarQty = function(delta) {
    QTY_ATUAL = Math.max(1, QTY_ATUAL + delta);
    var qEl = $('detail-qty-val');
    if (qEl) qEl.innerHTML = String(QTY_ATUAL);
    var btn = $('btn-add-cart');
    if (btn && PROD_ATUAL) {
      btn.innerHTML = 'Adicionar ao Carrinho — ' + formatMoney(PROD_ATUAL.preco * QTY_ATUAL);
    }
  };

  window.voltarMenu = function() {
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].className = 'view';
    renderMenu();
    $('view-menu').className = 'view active';
    if (MESA_ATUAL) $('hdr-title').innerHTML = MESA_ATUAL;
  };

  window.confirmarAddCarrinho = function() {
    if (!PROD_ATUAL) return;
    var obs = ($('detail-obs') ? $('detail-obs').value : '') || '';
    
    var found = false;
    for (var i = 0; i < CART.length; i++) {
      if (CART[i].id === PROD_ATUAL.id && CART[i].obs === obs) {
        CART[i].qty += QTY_ATUAL;
        CART[i].total = CART[i].qty * CART[i].preco;
        found = true;
        break;
      }
    }

    if (!found) {
      CART.push({
        id: PROD_ATUAL.id,
        nome: PROD_ATUAL.nome,
        emoji: PROD_ATUAL.emoji,
        preco: PROD_ATUAL.preco,
        setor: PROD_ATUAL.setor,
        status_inicial: PROD_ATUAL.status_inicial,
        qty: QTY_ATUAL,
        obs: obs,
        total: PROD_ATUAL.preco * QTY_ATUAL
      });
    }

    showToast('Adicionado ao carrinho!');
    voltarMenu();
  };

  // ── CART & SEND ORDERS ──
  function atualizarCartBadge() {
    var totalItens = 0;
    for (var i = 0; i < CART.length; i++) totalItens += CART[i].qty;
    
    var b1 = $('cart-badge-count');
    if (b1) b1.innerHTML = String(totalItens);

    var b2 = $('nav-cart-badge');
    if (b2) {
      b2.innerHTML = String(totalItens);
      b2.style.display = totalItens > 0 ? 'inline' : 'none';
    }
  }

  window.abrirCarrinho = function() {
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].className = 'view';
    renderCarrinho();
    $('view-cart').className = 'view active';
    $('hdr-title').innerHTML = 'Carrinho';
  };

  function renderCarrinho() {
    var list = $('cart-items-list');
    var sumBox = $('cart-summary-box');
    if (!list || !sumBox) return;

    if (!CART.length) {

  window.removerDoCarrinho = function(idx) {

      renderCarrinho();
      atualizarCartBadge();
    }

  window.enviarPedidoCozinha = function() {
    if (!CART.length) { showToast('Carrinho vazio!'); return; }
    if (!MESA_ATUAL) { showToast('Selecione uma mesa!'); return; }

    var btn = $('btn-enviar-pedido');
    if (btn) { btn.disabled = true; btn.innerHTML = 'Enviando...'; }

    var itensPayload = [];
    for (var i = 0; i < CART.length; i++) {
      var it = CART[i];
      itensPayload.push({
        userName: USER ? USER.nome : 'Garçom Lite',
        localName: MESA_ATUAL,
        mesa_comanda: MESA_ATUAL,
        mesa_grupo: MESA_ATUAL,
        productName: it.nome,
        productEmoji: it.emoji || '🍽️',
        quantity: it.qty,
        observations: it.obs || '',
        composicoes: [],
        sector: it.setor || '',
        total: it.preco * it.qty,
        status_inicial: it.status_inicial || 'Em preparo'
      });
    }

    var taskData = {
      mesaNome: MESA_ATUAL,
      userName: USER ? USER.nome : 'Garçom Lite',
      itens: itensPayload
    };

    makeXHR('POST', '/api/retro/pedidos/batch', taskData, function(err, res) {
      if (err || !res || !res.success) {
        // Enfileirar na Outbox para envio garantido
        OUTBOX_QUEUE.push({
          method: 'POST',
          url: '/api/retro/pedidos/batch',
          data: taskData
        });

        showToast('💾 Salvo na fila local! Sincronizando...');

        showToast('✅ Pedido enviado para a Cozinha e Caixa!');

    h += '<div style="display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-pack:justify;-webkit-justify-content:space-between;-ms-flex-pack:justify;justify-content:space-between;margin-top:4px;">';
    h += '<span><label style="cursor:pointer;"><input type="checkbox" ' + (INCLUIR_TAXA_SERVICO ? 'checked' : '') + ' onchange="toggleTaxa(this.checked)"> Taxa de Serviço (' + TAXA_SERVICO + '%)</label></span>';
    h += '<span>' + formatMoney(taxaValor) + '</span>';
    h += '</div>';

    h += '</select>';

  // ── COBRANÇA E CHECKOUT COMPLETO (CUSTOMER CHECKOUT) ──
  window.abrirCobranca = function() {
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].className = 'view';
    renderCobranca();
    $('view-cobranca').className = 'view active';
    $('hdr-title').innerHTML = 'Cobrança — ' + MESA_ATUAL;
  };

  function renderCobranca() {
    var b = $('cobranca-box');
    if (!b) return;

    var totalConsumo = 0;
    var itensCount = 0;

    for (var i = 0; i < PEDIDOS.length; i++) {
      var p = PEDIDOS[i];
      if (p.localName === MESA_ATUAL || p.mesa_comanda === MESA_ATUAL || p.mesa_grupo === MESA_ATUAL) {
        totalConsumo += Number(p.total) || 0;
        itensCount++;
      }
    }

    if (itensCount === 0 || totalConsumo <= 0) {
      b.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;">Nenhum valor pendente de pagamento nesta mesa.</div>';
      return;
    }

    var taxaValor = INCLUIR_TAXA_SERVICO ? (totalConsumo * TAXA_SERVICO / 100) : 0;
    var totalFinal = totalConsumo + taxaValor + GORJETA_COBRANCA;
    var valorPorPessoa = totalFinal / Math.max(1, DIVISAO_PESSOAS);

    var h = '<div class="bill-header">';
    h += '<div class="bill-title">Fechamento e Recebimento</div>';
    h += '<div class="bill-mesa">' + safeHtml(MESA_ATUAL) + ' • Total com Taxa: ' + formatMoney(totalFinal) + '</div>';
    h += '</div>';

    h += '<div class="bill-total-big" id="cobranca-total-display">' + formatMoney(totalFinal) + '</div>';

    if (DIVISAO_PESSOAS > 1) {
      h += '<div style="text-align:center;font-size:13px;font-weight:700;color:#22c55e;margin-bottom:8px;">' + DIVISAO_PESSOAS + ' pessoas de ' + formatMoney(valorPorPessoa) + ' cada</div>';
    }

    // Seletor de Métodos de Pagamento
    h += '<div style="font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:4px;">Selecione a Forma de Pagamento:</div>';
    h += '<div class="methods-grid">';
    var metodos = FORMAS_PAGAMENTO.length ? FORMAS_PAGAMENTO : [
      { nome: 'Dinheiro' },
      { nome: 'Cartão de Débito' },
      { nome: 'Cartão de Crédito' },
      { nome: 'PIX' },
      { nome: 'Vale Refeição' },
      { nome: 'Fiado' }
    ];

    for (var m = 0; m < metodos.length; m++) {
      var metNome = metodos[m].nome;
      var act = (metNome === METODO_COBRANCA) ? ' active' : '';
      h += '<button class="method-btn' + act + '" onclick="selecionarMetodoCobranca(\'' + metNome.replace(/'/g, "\\'") + '\')">' + safeHtml(metNome) + '</button>';
    }
    h += '</div>';

    // Dinheiro com calculadora rápida de troco
    if (METODO_COBRANCA === 'Dinheiro') {
      var troco = Math.max(0, VALOR_PAGO_DINHEIRO - totalFinal);
      h += '<div class="calc-troco">';
      h += '<div style="font-size:12px;font-weight:700;color:#94a3b8;">Valor Recebido em Dinheiro:</div>';
      h += '<input type="number" step="0.50" id="input-pago-dinheiro" value="' + (VALOR_PAGO_DINHEIRO || totalFinal).toFixed(2) + '" oninput="atualizarTroco(this.value)" style="width:100%;padding:10px;font-size:16px;font-weight:700;border-radius:6px;border:1px solid #3a3d45;background:#1a1d24;color:#fff;margin-top:4px;">';
      
      h += '<div class="quick-vals">';
      h += '<button onclick="setValorDinheiro(' + totalFinal.toFixed(2) + ')">Exato</button>';
      h += '<button onclick="setValorDinheiro(' + (Math.ceil(totalFinal / 10) * 10).toFixed(2) + ')">+' + formatMoney(Math.ceil(totalFinal / 10) * 10) + '</button>';
      h += '<button onclick="setValorDinheiro(' + (Math.ceil(totalFinal / 50) * 50).toFixed(2) + ')">+' + formatMoney(Math.ceil(totalFinal / 50) * 50) + '</button>';
      h += '<button onclick="setValorDinheiro(' + (Math.ceil(totalFinal / 100) * 100).toFixed(2) + ')">+' + formatMoney(Math.ceil(totalFinal / 100) * 100) + '</button>';
      h += '</div>';

      h += '<div style="display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-pack:justify;-webkit-justify-content:space-between;-ms-flex-pack:justify;justify-content:space-between;margin-top:8px;font-size:14px;font-weight:700;">';
      h += '<span>Troco a Devolver:</span>';
      h += '<span style="color:#22c55e;font-size:16px;">' + formatMoney(troco) + '</span>';
      h += '</div>';
      h += '</div>';
    }

    // PIX
    if (METODO_COBRANCA === 'PIX') {
      h += '<div style="background:#111318;border:1px solid #2a2d35;border-radius:8px;padding:12px;text-align:center;margin-top:8px;">';
      h += '<div style="font-size:13px;font-weight:700;color:#38bdf8;">Chave PIX do Estabelecimento:</div>';
      h += '<div style="font-size:14px;font-weight:700;margin:6px 0;background:#1a1d24;padding:8px;border-radius:6px;color:#fff;">' + safeHtml(CHAVE_PIX || 'Chave PIX cadastrada no Caixa') + '</div>';
      h += '<div style="font-size:11px;color:#94a3b8;">Apresente ao cliente para transferência instantânea.</div>';
      h += '</div>';
    }

    // Ações de Finalização
    h += '<div style="margin-top:14px;">';
    h += '<button class="btn-primary" id="btn-finalizar-cobranca" onclick="confirmarCobranca(false)">✅ Finalizar e Liberar Mesa (' + formatMoney(totalFinal) + ')</button>';
    h += '<button class="btn-secondary" onclick="confirmarCobranca(true)" style="margin-top:6px;">💰 Pagamento Parcial (Abater Valor)</button>';
    h += '</div>';

    b.innerHTML = h;
  }

  window.selecionarMetodoCobranca = function(met) {
    METODO_COBRANCA = met;
    renderCobranca();
  };

  window.atualizarTroco = function(val) {
    VALOR_PAGO_DINHEIRO = parseFloat(val) || 0;
    renderCobranca();
  };

  window.setValorDinheiro = function(val) {
    VALOR_PAGO_DINHEIRO = parseFloat(val) || 0;
    renderCobranca();
  };

  window.confirmarCobranca = function(isParcial) {
    if (!MESA_ATUAL) return;

    var totalConsumo = 0;
    for (var i = 0; i < PEDIDOS.length; i++) {
      var p = PEDIDOS[i];
      if (p.localName === MESA_ATUAL || p.mesa_comanda === MESA_ATUAL || p.mesa_grupo === MESA_ATUAL) {
        totalConsumo += Number(p.total) || 0;
      }
    }
    var taxaValor = INCLUIR_TAXA_SERVICO ? (totalConsumo * TAXA_SERVICO / 100) : 0;
    var totalFinal = totalConsumo + taxaValor + GORJETA_COBRANCA;

    var valorACobrar = totalFinal;

    if (isParcial) {
      var promptVal = prompt('Informe o valor a ser pago parcialmente para ' + MESA_ATUAL + ' (Total restante: ' + formatMoney(totalFinal) + '):', '0.00');
      if (!promptVal) return;
      valorACobrar = parseFloat(promptVal.replace(',', '.')) || 0;
      if (valorACobrar <= 0) { showToast('Valor inválido!'); return; }
    } else {
      if (!confirm('Confirmar recebimento de ' + formatMoney(totalFinal) + ' via ' + METODO_COBRANCA + ' e liberar ' + MESA_ATUAL + '?')) return;
    }

    var payload = {
      mesaNome: MESA_ATUAL,
      metodo: METODO_COBRANCA,
      valor: valorACobrar,
      gorjeta: GORJETA_COBRANCA,
      garcom: USER ? USER.nome : 'Garçom Lite',
      parcial: isParcial ? true : false
    };

    var btn = $('btn-finalizar-cobranca');
    if (btn) { btn.disabled = true; btn.innerHTML = 'Processando no Caixa...'; }

    makeXHR('POST', '/api/retro/cobranca', payload, function(err, res) {
      if (err || !res || !res.success) {
        // Enfileirar na outbox se foi erro de conexão
        OUTBOX_QUEUE.push({
          method: 'POST',
          url: '/api/retro/cobranca',
          data: payload
        });
        salvarOutbox();
        showToast('💾 Cobrança salva na fila local! Sincronizando com o Caixa...');
      } else {
        showToast(res.message || 'Cobrança confirmada com sucesso!');
      }

      voltarMesas();
      carregarDados();
    });
  };

  // ── NAVIGATION SWITCHER ──
  function switchTabButtons(tab) {
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) items[i].className = 'nav-item';
    var target = $('nav-' + tab);
    if (target) target.className = 'nav-item active';
  }

  window.switchTab = function(tab) {
    switchTabButtons(tab);
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].className = 'view';

    if (tab === 'mesas') {
      $('view-mesas').className = 'view active';
      $('hdr-title').innerHTML = 'Mesas';
      renderMesas();
    } else if (tab === 'cart') {
      $('view-cart').className = 'view active';
      $('hdr-title').innerHTML = 'Carrinho';
      renderCarrinho();
    } else if (tab === 'pedidos') {
      $('view-pedidos').className = 'view active';
      $('hdr-title').innerHTML = 'Prontos / Pedidos';
      renderPedidos();
    }
  };

  // ── INIT ON LOAD ──
  function initApp() {
    aplicarTema();
    tryAutoLogin();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }

})();
</script>
</body>
</html>
